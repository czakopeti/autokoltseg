name: Domain-ellenőrzés
# Kézzel indítható: névszerverek, DNS, az oldal válasza és a JavaScript-fájlok frissessége az autozom.hu-n.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ellenoriz:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Névszerverek és DNS
        run: |
          for t in NS A; do echo "== autozom.hu $t"; dig +short $t autozom.hu @1.1.1.1; done
      - name: HTTP-válaszok
        run: |
          for u in https://autozom.hu/ https://www.autozom.hu/ https://autozom.hu/kotelezo-biztositas-valtas/ https://autozom.hu/megjavitsam-vagy-csereljem/; do
            echo "== $u"; curl -sS -m 20 -o /dev/null -w "%{http_code} -> %{redirect_url}\n" "$u" || true
          done
      - name: JavaScript-fájlok és gyorsítótár-fejlécek
        run: |
          for f in app szamitas megjelenites; do
            echo "== /assets/js/$f.js"; curl -sSI -m 20 "https://autozom.hu/assets/js/$f.js" | grep -iE "^(cache-control|etag|age|cf-cache-status|last-modified)" || true
          done
          echo "== új függvények az éles fájlokban"
          curl -sS -m 20 https://autozom.hu/assets/js/szamitas.js | grep -c "export function kgfb\|export function javitasVagyCsere" || true
          curl -sS -m 20 https://autozom.hu/assets/js/megjelenites.js | grep -c "export function kgfbPanel\|export function javitasPanel" || true
          curl -sS -m 20 https://autozom.hu/assets/js/app.js | grep -c "kgfb: (adat, e)\|javitas: (adat, e)" || true
          echo "== a lap melyik app.js-t tölti"; curl -sS -m 20 https://autozom.hu/kotelezo-biztositas-valtas/ | grep -o 'js/app.js?v=[a-z0-9]*'
      - name: Visszajelzés-fogadó
        run: |
          echo "== GET /api/visszajelzes"; curl -sS -m 20 -w "\n%{http_code}\n" https://autozom.hu/api/visszajelzes || true
          echo "== doboz a vétlen baleset oldalon"; curl -sS -m 20 https://autozom.hu/vetlen-baleset/ | grep -c data-visszajelzes || true
          echo "== idegen oldalról tiltva (403 várható)"; curl -sS -m 20 -o /dev/null -w "%{http_code}\n" -X POST -H 'origin: https://pelda.example' -H 'content-type: application/json' -d '{"ut":"/x/","ertek":"fel"}' https://autozom.hu/api/visszajelzes || true
