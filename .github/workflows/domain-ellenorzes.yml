name: Domain-ellenőrzés
# Kézzel indítható: névszerverek, DNS, az oldal válasza és a JavaScript-fájlok frissessége az autozom.hu-n.
on:
  workflow_dispatch:
    inputs:
      proba:
        description: 'Küldjön egy próba-visszajelzést (GitHub-jegyet nyit)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  ellenoriz:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Névszerverek és DNS
        run: |
          for t in NS A; do echo "== autozom.hu $t"; dig +short $t autozom.hu @1.1.1.1; done
      - name: HTTP-válaszok
        run: |
          for u in https://autozom.hu/ https://www.autozom.hu/ https://autozom.hu/kotelezo-biztositas-valtas/ https://autozom.hu/megjavitsam-vagy-csereljem/; do
            echo "== $u"; curl -sS -m 20 -o /dev/null -w "%{http_code} -> %{redirect_url}\n" "$u" || true
          done
      - name: JavaScript-fájlok és gyorsítótár-fejlécek
        run: |
          for f in app szamitas megjelenites; do
            echo "== /assets/js/$f.js"; curl -sSI -m 20 "https://autozom.hu/assets/js/$f.js" | grep -iE "^(cache-control|etag|age|cf-cache-status|last-modified)" || true
          done
          echo "== új függvények az éles fájlokban"
          curl -sS -m 20 https://autozom.hu/assets/js/szamitas.js | grep -c "export function kgfb\|export function javitasVagyCsere" || true
          curl -sS -m 20 https://autozom.hu/assets/js/megjelenites.js | grep -c "export function kgfbPanel\|export function javitasPanel" || true
          curl -sS -m 20 https://autozom.hu/assets/js/app.js | grep -c "kgfb: (adat, e)\|javitas: (adat, e)" || true
          echo "== a lap melyik app.js-t tölti"; curl -sS -m 20 https://autozom.hu/kotelezo-biztositas-valtas/ | grep -o 'js/app.js?v=[a-z0-9]*'
      - name: Visszajelzés-fogadó
        run: |
          echo "== GET /api/visszajelzes"; curl -sS -m 20 -w "\n%{http_code}\n" https://autozom.hu/api/visszajelzes || true
          echo "== GET /api/meres (havi összesítő)"; curl -sS -m 20 -w "\n%{http_code}\n" https://autozom.hu/api/meres || true
          echo "== POST /api/meres ismeretlen eseménnyel (400 várható, nem ír semmit)"; curl -sS -m 20 -X POST -H 'origin: https://autozom.hu' -H 'content-type: application/json' -d '{"ut":"/","esemeny":"proba"}' -w "\n%{http_code}\n" https://autozom.hu/api/meres || true
          echo "== doboz a vétlen baleset oldalon"; curl -sS -m 20 https://autozom.hu/vetlen-baleset/ | grep -c data-visszajelzes || true
          echo "== idegen oldalról tiltva (403 várható)"; curl -sS -m 20 -o /dev/null -w "%{http_code}\n" -X POST -H 'origin: https://pelda.example' -H 'content-type: application/json' -d '{"ut":"/x/","ertek":"fel"}' https://autozom.hu/api/visszajelzes || true
      - name: Próba-visszajelzés (csak ha kérik)
        if: ${{ inputs.proba }}
        run: |
          curl -sS -m 20 -w "\n%{http_code}\n" -X POST -H 'origin: https://autozom.hu' -H 'content-type: application/json' \
            -d '{"ut":"/gepjarmuado-kalkulator/","ertek":"szoveg","szoveg":"Próba: a visszajelzés-doboz beállításának ellenőrzése. Ezt a jegyet nyugodtan le lehet zárni.","cim":"Gépjárműadó | autózom"}' \
            https://autozom.hu/api/visszajelzes || true
          curl -sS -m 20 -X POST -H 'origin: https://autozom.hu' -H 'content-type: application/json' -d '{"ut":"/gepjarmuado-kalkulator/","ertek":"fel"}' https://autozom.hu/api/visszajelzes || true
          echo; curl -sS -m 20 https://autozom.hu/api/visszajelzes || true
      - name: A sitemap minden oldala és az IndexNow-kulcs
        run: |
          for u in $(curl -sS -m 20 https://autozom.hu/sitemap.xml | grep -o '<loc>[^<]*' | sed 's/<loc>//'); do
            printf '%s %s\n' "$(curl -sS -m 20 -o /dev/null -w '%{http_code}' "$u")" "$u"
          done
          k=$(jq -r .indexnow_kulcs config.json 2>/dev/null || true)
          [ -n "$k" ] && printf 'kulcsfájl: %s\n' "$(curl -sS -m 20 https://autozom.hu/$k.txt)"
          echo "== Vállalkozóknak gomb a főoldalon"; curl -sS -m 20 https://autozom.hu/ | grep -c 'class="vall-gomb"' || true
          echo "== Letölthető adatok"
          for f in web/adatok/*.csv; do
            u="https://autozom.hu/adatok/$(basename "$f")"
            printf '%s %s sorok=%s\n' "$(curl -sS -m 20 -o /dev/null -w '%{http_code} %{content_type}' "$u")" "$u" "$(curl -sS -m 20 "$u" | wc -l)"
          done
